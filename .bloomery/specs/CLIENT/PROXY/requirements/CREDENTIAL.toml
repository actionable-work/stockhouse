group = "CREDENTIAL"

[[requirements]]
id = "CLIENT-PROXY-CREDENTIAL-001"
title = "Credentials go only to their own tier"
manual = false
design = "design/proxy.md"
[requirements.ears]
type = "event"
trigger = "a tier configured with a credential is consulted"
system = "proxy upstream client"
action = "send `Authorization: Bearer <credential>` to that tier and send no `Authorization` header to any other tier, including the public tier"

[[requirements]]
id = "CLIENT-PROXY-CREDENTIAL-002"
title = "Redirects are never followed"
manual = false
design = "design/proxy.md"
[requirements.ears]
type = "event"
trigger = "an upstream answers with a 3xx redirect"
system = "proxy upstream client"
action = "not request the redirect target and treat the response as `Unavailable`"

[[requirements]]
id = "CLIENT-PROXY-CREDENTIAL-003"
title = "Credentials never appear in errors, logs or responses"
manual = false
design = "design/proxy.md"
[requirements.ears]
type = "event"
trigger = "a lookup through a credentialed tier fails"
system = "proxy"
action = "produce error text, log lines and response bodies that do not contain the credential value"

[[requirements]]
id = "CLIENT-PROXY-CREDENTIAL-004"
title = "Each failed lookup logs one line"
manual = false
design = "design/proxy.md"
[requirements.ears]
type = "event"
trigger = "a narinfo or NAR request fails with a `ProxyError`"
system = "proxy"
action = "write exactly one stderr line naming the tier, the route kind and the error kind"

[[requirements]]
id = "CLIENT-PROXY-CREDENTIAL-005"
title = "Credentials are resolved off the async workers"
manual = false
design = "design/proxy.md"
[requirements.ears]
type = "event"
trigger = "a tier's credential source blocks while it is resolved"
system = "proxy"
action = "resolve it through `spawn_blocking` so that other requests, such as `/nix-cache-info`, are still answered meanwhile"

[[requirements]]
id = "CLIENT-PROXY-CREDENTIAL-006"
title = "A 401 with a refreshable credential is retried once"
manual = false
design = "design/proxy.md"
[requirements.ears]
type = "event"
trigger = "a tier answers 401 to a request that carried a credential whose source's `invalidate` returns `true`"
system = "proxy upstream client"
action = "resolve the credential again and repeat the same request once with the new credential, serving the result of the retry"

[[requirements]]
id = "CLIENT-PROXY-CREDENTIAL-007"
title = "A repeated 401 is a 503, never a miss"
manual = false
design = "design/proxy.md"
[requirements.ears]
type = "event"
trigger = "a tier answers 401 to the retried request, or to any later request in the same proxy request"
system = "proxy"
action = "answer 503 for `ProxyError::Denied` naming the tier without another invalidation and send no request to any later tier"

[[requirements]]
id = "CLIENT-PROXY-CREDENTIAL-008"
title = "A signed-out credential is a 503"
manual = false
design = "design/proxy.md"
[requirements.ears]
type = "event"
trigger = "resolving the credential again after an invalidation fails, for example with `CredentialError::SignedOut`"
system = "proxy"
action = "answer 503 for `ProxyError::Credential` naming the tier, sending no further request to that tier or any later tier"

[[requirements]]
id = "CLIENT-PROXY-CREDENTIAL-009"
title = "Static credentials and 403 are not retried"
manual = false
design = "design/proxy.md"
[requirements.ears]
type = "event"
trigger = "a tier answers 403, or answers 401 to a credential whose source's `invalidate` returns `false`"
system = "proxy upstream client"
action = "answer 503 for `ProxyError::Denied` after exactly one request to that tier"

[[requirements]]
id = "CLIENT-PROXY-CREDENTIAL-010"
title = "The retry covers cache info, narinfo and NAR fetches"
manual = false
design = "design/proxy.md"
[requirements.ears]
type = "event"
trigger = "a tier first answers 401 to its `nix-cache-info`, narinfo or NAR request with a refreshable credential"
system = "proxy"
action = "retry that request once and use the new credential for the remaining upstream requests of the same proxy request, retrying a NAR only before any response byte is sent"

[[requirements]]
id = "CLIENT-PROXY-CREDENTIAL-011"
title = "Credential failures log their kind"
manual = false
design = "design/proxy.md"
[requirements.ears]
type = "event"
trigger = "a lookup fails with `ProxyError::Credential`"
system = "proxy"
action = "write one stderr line naming the tier, the route kind, `credential` and the credential error kind, such as `signed-out`"

[[requirements]]
id = "CLIENT-PROXY-CREDENTIAL-012"
title = "Upstream requests ignore environment proxies"
manual = false
design = "design/proxy.md"
[requirements.ears]
type = "event"
trigger = "a tier is fetched while `HTTP_PROXY`, `HTTPS_PROXY` or `ALL_PROXY` is set"
system = "tier upstream"
action = "connect to the tier directly and send nothing, in particular no tier credential, through the environment-configured proxy"
