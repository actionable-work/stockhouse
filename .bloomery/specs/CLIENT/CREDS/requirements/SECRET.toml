group = "SECRET"

[[requirements]]
id = "CLIENT-CREDS-SECRET-001"
title = "Secrets are redacted in formatting"
manual = false
design = "design/credentials.md"
[requirements.ears]
type = "ubiquitous"
system = "`Secret` type"
action = "render `Secret(<redacted>)` for both `Debug` and `Display` and expose its bytes only through an explicit accessor"

[[requirements]]
id = "CLIENT-CREDS-SECRET-002"
title = "Credential errors never contain credential content"
manual = false
design = "design/credentials.md"
[requirements.ears]
type = "event"
trigger = "a credential source rejects a file whose content is otherwise readable"
system = "credential error formatting"
action = "name the source and failed check without including any byte of the file content"

[[requirements]]
id = "CLIENT-CREDS-SECRET-003"
title = "Token sets are redacted"
manual = false
design = "design/store.md"
[requirements.ears]
type = "event"
trigger = "a `TokenSet` is formatted with `Debug`"
system = "token set"
action = "render both tokens as `Secret(<redacted>)`"

[[requirements]]
id = "CLIENT-CREDS-SECRET-004"
title = "Sign-in errors never contain secrets"
manual = false
design = "design/oauth.md"
[requirements.ears]
type = "event"
trigger = "a login, refresh, logout or store operation fails after the client has handled a token, authorization code, PKCE verifier, state, device code, key or response body"
system = "sign-in error formatting"
action = "produce `Display` and `Debug` text that contains none of those values, no `error_description` and no response body"
