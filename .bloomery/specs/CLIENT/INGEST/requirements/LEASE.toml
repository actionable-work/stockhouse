group = "LEASE"

[[requirements]]
id = "CLIENT-INGEST-LEASE-001"
title = "A valid lease configuration loads"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "a lease configuration with version 1, a base URL, a credential, an absolute `machine_id_file` and optional paths, timeout and extra slots is parsed"
system = "lease configuration parser"
action = "return every field with `current_system` `/run/current-system`, `system_profile` `/nix/var/nix/profiles/system` and timeout 60 unless configured"

[[requirements]]
id = "CLIENT-INGEST-LEASE-002"
title = "Lease configuration rejects bad input"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "a lease configuration has a syntax error, an unknown or missing field, another version, a relative path, an extra slot outside 3–10 or repeated, a timeout outside 1–300 seconds or an invalid endpoint"
system = "lease configuration parser"
action = "return `LeaseConfigError::Parse`, `UnsupportedVersion`, `RelativePath`, `InvalidSlot`, `InvalidLimit` or `Endpoint` respectively"

[[requirements]]
id = "CLIENT-INGEST-LEASE-003"
title = "The machine identity is created once"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "the lease command runs and `machine_id_file` does not exist"
system = "lease client"
action = "write 16 random bytes as 32 lowercase hex characters and a newline with mode 0600 by staged hard link, and use the identity read back from the file"

[[requirements]]
id = "CLIENT-INGEST-LEASE-004"
title = "The machine identity is reused"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "the lease command runs again, including after a reboot"
system = "lease client"
action = "use the identity already in `machine_id_file` without rewriting it"

[[requirements]]
id = "CLIENT-INGEST-LEASE-005"
title = "An unusable machine identity file fails closed"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "`machine_id_file` is a symbolic link or not a regular file, is owned by another user, has group or other permission bits, or does not hold exactly 32 lowercase hex characters and a newline"
system = "lease client"
action = "return `LeaseError::MachineId` naming the check, send no request and leave the file unchanged"

[[requirements]]
id = "CLIENT-INGEST-LEASE-006"
title = "Slot 1 is the current system"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "the lease command runs"
system = "lease client"
action = "renew slot 1 with the store path `current_system` resolves to"

[[requirements]]
id = "CLIENT-INGEST-LEASE-007"
title = "Slot 2 is the newest other system generation"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "system profile generation links exist"
system = "lease client"
action = "renew slot 2 with the target of the largest-numbered `<system_profile>-<N>-link` whose target differs from slot 1, and skip slot 2 when there is none"

[[requirements]]
id = "CLIENT-INGEST-LEASE-008"
title = "Unresolvable slots are skipped"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "a slot's path does not resolve or resolves outside the store"
system = "lease client"
action = "skip that slot with one log line and renew the other slots"

[[requirements]]
id = "CLIENT-INGEST-LEASE-009"
title = "Lease renewals use the protocol path and body"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "a slot is renewed using protocol v1"
system = "lease client"
action = "send `PUT leases/<machine-id>/<slot>` with `Content-Type: application/json` and `{\"version\":1,\"store_path\":…}` under the server endpoint rules"

[[requirements]]
id = "CLIENT-INGEST-LEASE-010"
title = "A failing slot does not stop the others"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "a v1 slot renewal is refused, answered 503 (including a full machine table) or fails in transport or by timeout"
system = "lease client"
action = "log the slot and the code or failure and still renew every later slot"

[[requirements]]
id = "CLIENT-INGEST-LEASE-011"
title = "Lease exit status reports the run"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "the lease command finishes"
system = "lease client"
action = "exit 0 when every slot was renewed or skipped, 75 when any slot was refused or failed or any credential error occurred, 1 for a machine identity error and 2 for a configuration error"

[[requirements]]
id = "CLIENT-INGEST-LEASE-012"
title = "Lease runs are idempotent"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "the lease command runs twice with the same system"
system = "lease client"
action = "send the same requests both times and change no local state other than creating a missing machine identity"

[[requirements]]
id = "CLIENT-INGEST-LEASE-013"
title = "v2 leases renew in one request"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "the lease client has at least one resolved slot and selects protocol version 2"
system = "lease client"
action = "renew every resolved slot with one `POST v2/leases` in slot order and map `Renewed` to renewed, `Refused(UnknownPath | Conflict)` to refused and `MachinesFull` to failed, and a request-level `Refused(BadRequest)` to every slot refused"

[[requirements]]
id = "CLIENT-INGEST-LEASE-014"
title = "A lease batch without v2 falls back within an auto run"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "a lease batch is answered `NotSupported` under `protocol = \"auto\"`"
system = "lease client"
action = "renew each slot in the same run with v1 `PUT leases/<machine>/<slot>`"

[[requirements]]
id = "CLIENT-INGEST-LEASE-015"
title = "Lease batch outages resend and then fail"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "a lease batch is answered `Busy`, `Unavailable`, a transport error or a timeout"
system = "lease client"
action = "resend it identically at most twice with the batch waits, then treat every slot as failed and exit 75"

[[requirements]]
id = "CLIENT-INGEST-LEASE-016"
title = "Lease probe failures fail every slot"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "the lease client probe fails, or offers no version 2 under `protocol = \"v2\"`"
system = "lease client"
action = "send no renewal and exit 75 with every slot failed"

[[requirements]]
id = "CLIENT-INGEST-LEASE-017"
title = "Auto lease runs follow the probe"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "the lease client has resolved slots and runs with `protocol = \"auto\"` against a server whose probe offers `[1, 2]`, offers `[1]` or answers 404"
system = "lease client"
action = "send one probe, then renew with one v2 lease batch for `[1, 2]` and with v1 per-slot requests otherwise"

[[requirements]]
id = "CLIENT-INGEST-LEASE-018"
title = "A lease probe answered 401 follows the 401 rule"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "the lease client probe is answered `Unauthorized`"
system = "lease client"
action = "send the probe once more only after a successful `CredentialSource::invalidate`, and otherwise, or when that is also `Unauthorized`, send no renewal and exit 75 with every slot failed"

[[requirements]]
id = "CLIENT-INGEST-LEASE-019"
title = "Required v2 leases never fall back"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "a lease batch is answered `NotSupported` under `protocol = \"v2\"`"
system = "lease client"
action = "send no v1 request and exit 75 with every slot failed"

[[requirements]]
id = "CLIENT-INGEST-LEASE-020"
title = "A run with no resolved slots needs no network request"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "a lease run with a usable machine identity and credential resolves no slot to a store path"
system = "lease client"
action = "log the applicable skipped slots and exit 0 without sending a probe or renewal"
