group = "CONFIG"

[[requirements]]
id = "CLIENT-INGEST-CONFIG-001"
title = "A valid uploader configuration loads"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "an uploader configuration with version 1 and valid limits, backend and scanner is parsed"
system = "uploader configuration parser"
action = "return every limit, the backend and the scanner as configured"

[[requirements]]
id = "CLIENT-INGEST-CONFIG-002"
title = "Uploader configuration rejects bad versions and fields"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "an uploader configuration has a version other than 1 or an unknown field"
system = "uploader configuration parser"
action = "return `UploaderConfigError::UnsupportedVersion` or `UploaderConfigError::Parse` respectively"

[[requirements]]
id = "CLIENT-INGEST-CONFIG-003"
title = "Uploader limits must be usable"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "an uploader configuration has a relative queue directory, a zero limit, or a backoff base greater than its maximum"
system = "uploader configuration parser"
action = "return `UploaderConfigError::RelativeQueueDir` or `UploaderConfigError::InvalidLimit` naming the field"

[[requirements]]
id = "CLIENT-INGEST-CONFIG-004"
title = "nix-copy requires a local file destination"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "the `nix-copy` backend is configured without an absolute `file://` destination"
system = "uploader configuration parser"
action = "return `UploaderConfigError::UnsupportedDestination`"

[[requirements]]
id = "CLIENT-INGEST-CONFIG-005"
title = "A server backend configuration loads"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "an uploader configuration with a `server` backend naming `base_url` and a `file` or `systemd` credential is parsed"
system = "uploader configuration parser"
action = "return the server backend with its base URL, credential and `nix`, `request_timeout_secs` 60 and `max_closure_paths` 50000 unless configured"

[[requirements]]
id = "CLIENT-INGEST-CONFIG-006"
title = "Server backend configuration rejects bad fields and limits"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "a `server` backend has an unknown field, no credential, a `request_timeout_secs` outside 1–300 or a zero `max_closure_paths`"
system = "uploader configuration parser"
action = "return `UploaderConfigError::Parse` or `UploaderConfigError::InvalidLimit` naming the field respectively"

[[requirements]]
id = "CLIENT-INGEST-CONFIG-007"
title = "The server protocol setting is validated"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "a server backend or lease configuration is parsed with or without `protocol`"
system = "uploader and lease configuration parsers"
action = "default it to `auto`, accept `auto`, `v1` and `v2`, and return `Parse` for any other value"

[[requirements]]
id = "CLIENT-INGEST-CONFIG-008"
title = "Concurrent NAR transfers are bounded"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "a server backend configuration is parsed with or without `max_inflight_nars`"
system = "uploader configuration parser"
action = "default it to 4, accept 1 to 16, and return `UploaderConfigError::InvalidLimit` naming `max_inflight_nars` otherwise"
