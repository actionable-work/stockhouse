group = "QUEUE"

[[requirements]]
id = "CLIENT-INGEST-QUEUE-001"
title = "Queue creation writes the versioned layout and limits"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "the uploader creates a queue with a maximum pending count"
system = "queue"
action = "create `pending/`, `failed/`, `done/` and `tmp/`, write `FORMAT` as `stockhouse-queue-v1` if absent and write `LIMITS` with that maximum, keeping existing records"

[[requirements]]
id = "CLIENT-INGEST-QUEUE-002"
title = "Unknown or missing queue formats are rejected"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "a queue is opened whose `FORMAT` or `LIMITS` is missing or unparsable, or whose `FORMAT` differs from the current format"
system = "queue"
action = "return `QueueError::NotInitialized` or `QueueError::UnsupportedFormat` respectively"

[[requirements]]
id = "CLIENT-INGEST-QUEUE-003"
title = "A new path is queued with a fresh identity"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "a store path that is neither pending, failed nor uploaded is enqueued below capacity"
system = "queue"
action = "durably write one pending record with a new `UploadId`, zero attempts and `next_attempt_at` equal to now, and return `Queued` with that identity"

[[requirements]]
id = "CLIENT-INGEST-QUEUE-004"
title = "A pending path keeps its identity"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "a store path that already has a pending record is enqueued again"
system = "queue"
action = "leave the record unchanged and return `AlreadyQueued` with the existing identity"

[[requirements]]
id = "CLIENT-INGEST-QUEUE-005"
title = "An uploaded path is not queued again"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "a store path with a done record is enqueued"
system = "queue"
action = "write no record and return `AlreadyUploaded`"

[[requirements]]
id = "CLIENT-INGEST-QUEUE-013"
title = "A failed path stays failed"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "a store path with a failed record is enqueued"
system = "queue"
action = "write no pending record and return `AlreadyFailed` with the failed record's identity"

[[requirements]]
id = "CLIENT-INGEST-QUEUE-006"
title = "Concurrent enqueues create one record"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "several producers enqueue the same store path concurrently"
system = "queue"
action = "create exactly one pending record, and every producer reports the identity of that record"

[[requirements]]
id = "CLIENT-INGEST-QUEUE-007"
title = "A full queue overflows visibly"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "a producer enqueues a store path while `pending/` holds `max_pending` records"
system = "queue"
action = "write no pending record, append one byte to the `overflow` marker and return `Overflow`"

[[requirements]]
id = "CLIENT-INGEST-QUEUE-008"
title = "The overflow marker is bounded"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "the overflow marker has reached 1 MiB"
system = "queue"
action = "append nothing further while still reporting overflow as active and truncated"

[[requirements]]
id = "CLIENT-INGEST-QUEUE-009"
title = "Status reports counts and overflow"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "queue status is requested"
system = "queue"
action = "report pending, failed and uploaded counts, the earliest `next_attempt_at`, and overflow as active, dropped count and truncated across both overflow markers"

[[requirements]]
id = "CLIENT-INGEST-QUEUE-010"
title = "Only due records are attempted, in order"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "an uploader pass selects work"
system = "queue"
action = "return at most `batch_size` pending records with `next_attempt_at` not after now, ordered by `next_attempt_at` and then identity"

[[requirements]]
id = "CLIENT-INGEST-QUEUE-011"
title = "Corrupt records are quarantined"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "a pending record cannot be parsed or has a version other than 1"
system = "queue"
action = "move it unchanged to `failed/<hash>.corrupt` and continue with the remaining records"

[[requirements]]
id = "CLIENT-INGEST-QUEUE-012"
title = "Interrupted completions are reconciled"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "a pending record exists for a path that also has a done record"
system = "queue"
action = "remove the pending record without uploading it again"

[[requirements]]
id = "CLIENT-INGEST-QUEUE-014"
title = "Stale staging files never block writes"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "a queue write finds its staging name in `tmp/` already taken by a file a crashed process left behind"
system = "queue"
action = "stage under the next free name, complete the write and leave the stale file untouched"

[[requirements]]
id = "CLIENT-INGEST-QUEUE-015"
title = "A path blocked by a corrupt record is recorded as overflow"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "a path is enqueued with overflow recording while its pending record is unreadable"
system = "queue"
action = "return `Overflow`, leave the unreadable record untouched for quarantine and record the drop in the overflow marker so a later rescan enqueues the path"

[[requirements]]
id = "CLIENT-INGEST-QUEUE-016"
title = "A rescan blocked by a corrupt record keeps its held overflow"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "a rescan enqueues a path whose pending record is unreadable"
system = "queue"
action = "return `Overflow` without appending to the live overflow marker, so the rescan stops incomplete and keeps the marker it holds"

[[requirements]]
id = "CLIENT-INGEST-QUEUE-017"
title = "The uploads directory is additive to format v1"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "`Queue::create` runs on a queue with or without `uploads/`"
system = "queue"
action = "create `uploads/` when absent while leaving `FORMAT`, records and done records unchanged, and let `Queue::open` succeed on a v1 queue without `uploads/`"

[[requirements]]
id = "CLIENT-INGEST-QUEUE-018"
title = "A dependency's upload identity is created once"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "`Queue::upload_state` is called for a path with no valid pending record, repeatedly or by a new process"
system = "queue"
action = "create the entry by staged hard link with a fresh identity and `nar_sent = false` on first use, and return the existing valid entry on later calls"

[[requirements]]
id = "CLIENT-INGEST-QUEUE-019"
title = "The queued path's upload identity is the record identity"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "`Queue::upload_state` is called for a path with a valid pending record, as a root or a dependency"
system = "queue"
action = "use the current pending record identity, durably writing an entry with `nar_sent = false` if the entry is absent or has another identity, and otherwise leave the mark unchanged"

[[requirements]]
id = "CLIENT-INGEST-QUEUE-020"
title = "Corrupt upload entries are quarantined"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "an `uploads/` entry does not parse, has a version other than 1 or names another store path"
system = "queue"
action = "move its bytes unchanged to `failed/<hash>.upload.corrupt`, count it in `status.failed`, and create a replacement entry"

[[requirements]]
id = "CLIENT-INGEST-QUEUE-021"
title = "The NAR-sent mark is durable before the NAR is sent"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "`Queue::mark_nar_sent` or `Queue::clear_nar_sent` returns"
system = "queue"
action = "have replaced the entry atomically with the new `nar_sent` value and synced it, so a restarted process reads that value"

[[requirements]]
id = "CLIENT-INGEST-QUEUE-022"
title = "Completing a path writes the ledger first"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "`Queue::complete_path` records a path as uploaded"
system = "queue"
action = "write `done/<hash>.json` with the entry's identity when absent and only then remove the `uploads/` entry"

[[requirements]]
id = "CLIENT-INGEST-QUEUE-023"
title = "Stale upload entries are reconciled"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "a pass reconciles an `uploads/` entry whose done record exists or whose store path no longer exists"
system = "uploader pass"
action = "remove that entry and keep every other entry unchanged"

[[requirements]]
id = "CLIENT-INGEST-QUEUE-024"
title = "A ledger entry can be forgotten"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "`Queue::forget_done` is called for a path"
system = "queue"
action = "remove that path's done record so the path is no longer reported uploaded"

[[requirements]]
id = "CLIENT-INGEST-QUEUE-025"
title = "Renewed identities are durable and kept by the record"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "a root or dependency identity is renewed with `Queue::renew_identity`, including a crash between its writes"
system = "queue"
action = "durably write a fresh `UploadId` to the path's valid pending record if one exists, preserving all other fields, then durably write the `uploads/` entry with that identity and `nar_sent = false` before returning, and repair a torn renewal from the pending record on the next lookup for either role"

[[requirements]]
id = "CLIENT-INGEST-QUEUE-026"
title = "Outcomes use the current pending identity"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "the worker applies an outcome after an earlier upload renewed the pending record identity"
system = "uploader worker"
action = "reread the record and use its current identity in any pending, failed or done record written for the outcome"

[[requirements]]
id = "CLIENT-INGEST-QUEUE-027"
title = "Ledger completion supersedes a queued outcome"
manual = false
design = "design/ingest.md"
[requirements.ears]
type = "event"
trigger = "the worker applies an outcome for a path already in the ledger, including one that a later group completed as a dependency"
system = "uploader worker"
action = "keep the existing done record, remove the pending record and count the job as uploaded without moving it to failed or scheduling a retry"
