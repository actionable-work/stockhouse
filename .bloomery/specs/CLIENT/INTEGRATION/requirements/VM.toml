group = "VM"

[[requirements]]
id = "CLIENT-INTEGRATION-VM-001"
title = "The proxy listens only on loopback"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "a VM with the client module boots"
system = "proxy service"
action = "become active and listen on `127.0.0.1:8484` and on no other address"

[[requirements]]
id = "CLIENT-INTEGRATION-VM-002"
title = "A build is ingested and uploaded"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "a derivation is built in the VM"
system = "installed client"
action = "enqueue its output through the post-build hook and upload it with the `nix-copy` backend to the private file tier"

[[requirements]]
id = "CLIENT-INTEGRATION-VM-003"
title = "A signed uploaded closure substitutes through the proxy"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "an uploaded output signed by the daemon's fixture key is deleted from the VM store and realised again"
system = "installed client"
action = "substitute it from the private tier through the proxy"

[[requirements]]
id = "CLIENT-INTEGRATION-VM-004"
title = "Tampered cache content is not substituted"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "the private tier's narinfo or NAR for an uploaded output is altered and the output is realised again"
system = "installed client"
action = "answer 502 for the altered narinfo, fail substitution of the altered NAR, and contact no other substituter"

[[requirements]]
id = "CLIENT-INTEGRATION-VM-011"
title = "Denied and unavailable tiers do not fall through"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "real Nix realises, without a known deriver, store paths whose shared-tier lookup answers 403 or 500"
system = "installed client"
action = "fail the substitution with the proxy answering 503 and no request reaching any later tier"

[[requirements]]
id = "CLIENT-INTEGRATION-VM-005"
title = "An unwritable queue does not fail builds"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "the queue's pending directory is made unwritable for its owner when a derivation is built"
system = "installed client"
action = "let the build succeed with no pending record created"

[[requirements]]
id = "CLIENT-INTEGRATION-VM-006"
title = "Pending uploads survive reboot with their identity"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "a derivation is built while the uploader is stopped and the VM then reboots"
system = "installed client"
action = "keep the pending record across the reboot and upload it with the identity assigned before the reboot"

[[requirements]]
id = "CLIENT-INTEGRATION-VM-007"
title = "Overflow is visible in status"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "more outputs are built than `maxPending` allows while the uploader is stopped"
system = "installed client"
action = "report overflow as active with a nonzero dropped count in `stockhouse status`"

[[requirements]]
id = "CLIENT-INTEGRATION-VM-012"
title = "Overflow is reconciled by rescan"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "the uploader starts after overflow"
system = "installed client"
action = "rescan with `nix path-info`, upload the dropped outputs and report overflow as inactive"

[[requirements]]
id = "CLIENT-INTEGRATION-VM-008"
title = "Credentials stay out of arguments, units and configuration"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "a credentialed shared tier is configured from a runtime file"
system = "installed client"
action = "send the credential as a bearer header to that tier while the proxy's command line, unit files and generated configuration do not contain it"

[[requirements]]
id = "CLIENT-INTEGRATION-VM-009"
title = "Configuration upgrade and rollback apply"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "the VM switches to a specialisation with a changed proxy priority and then back"
system = "installed client"
action = "restart the proxy with the new priority, serve the original priority after rollback, and keep the queue readable throughout"

[[requirements]]
id = "CLIENT-INTEGRATION-VM-010"
title = "Both pinned Nix versions are qualified"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "the VM tests run"
system = "VM test suite"
action = "run every VM requirement once with Nix 2.34.8 and once with Nix 2.31.5 as both client and daemon"

[[requirements]]
id = "CLIENT-INTEGRATION-VM-013"
title = "Device login signs the machine in"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "`stockhouse-auth login --device` is run and the fake server approves the printed user code"
system = "installed client"
action = "store a sealed token set, report signed in from `stockhouse-auth status`, and substitute a private-tier path through the proxy with the access token"

[[requirements]]
id = "CLIENT-INTEGRATION-VM-014"
title = "Loopback login signs the machine in"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "`stockhouse-auth login` is run and the printed authorization URL is opened on the machine"
system = "installed client"
action = "receive the code on the `127.0.0.1` loopback callback, exchange it with the PKCE verifier and report signed in"

[[requirements]]
id = "CLIENT-INTEGRATION-VM-015"
title = "Refresh across expiry is serialized"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "the access token expires while the proxy serves concurrent lookups and several sign-in processes refresh concurrently"
system = "installed client"
action = "keep serving private-tier hits, rotate the refresh token, and never send a rotated refresh token to the fake server again"

[[requirements]]
id = "CLIENT-INTEGRATION-VM-016"
title = "A revoked grant is a 503, not a miss"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "the fake server revokes the grant family and a private-tier path is looked up and realised"
system = "installed client"
action = "answer 503 for the narinfo through the proxy, fail the realisation with Nix reporting the 503 instead of treating it as a miss, report signed out from `stockhouse-auth status`, log the signed-out credential, and after signing in again substitute the same path at once with no negative cache entry in the way"

[[requirements]]
id = "CLIENT-INTEGRATION-VM-017"
title = "Logout revokes and deletes"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "`stockhouse-auth logout` is run while signed in"
system = "installed client"
action = "send the refresh token to the fake revocation endpoint, ending its grant family, delete the token store and make later private-tier lookups answer 503"

[[requirements]]
id = "CLIENT-INTEGRATION-VM-018"
title = "Tokens stay in the owner-only sealed store"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "the machine is signed in"
system = "installed client"
action = "keep the store directory `0700` and its file `0600`, both owned by `stockhouse`, with neither token in `tokens.sealed`, the journal, any process's arguments, the units or the generated configuration"

[[requirements]]
id = "CLIENT-INTEGRATION-VM-019"
title = "A closure uploads references first"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "a derivation whose output references another locally built output is built with the server backend"
system = "installed client"
action = "declare and upload the referenced output before the referrer with the bearer credential, and reach the fake server's published set with no `missing_references` reply"

[[requirements]]
id = "CLIENT-INTEGRATION-VM-020"
title = "Held and already uploaded paths are not sent again"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "a closure contains a path the fake server reports `present` and a path already in the done ledger"
system = "installed client"
action = "send no NAR for the present path and no request for the ledgered path, and still upload the rest of the closure"

[[requirements]]
id = "CLIENT-INTEGRATION-VM-021"
title = "A verification failure rejects the record"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "the fake server answers `verification_failed` to a path's NAR"
system = "installed client"
action = "move that record to `failed/` with a reason naming the code, while the build succeeded"

[[requirements]]
id = "CLIENT-INTEGRATION-VM-022"
title = "An upload interrupted by a restart keeps its identity"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "the uploader is restarted while the fake server stalls a NAR body"
system = "installed client"
action = "after the restart reconcile with `GET` and finish the upload with the identity used before the restart"

[[requirements]]
id = "CLIENT-INTEGRATION-VM-023"
title = "A lost reply is reconciled without resending"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "the fake server publishes a NAR and closes the connection without replying"
system = "installed client"
action = "record the attempt as uncertain, then complete the upload after one `GET` and no second `PUT`"

[[requirements]]
id = "CLIENT-INTEGRATION-VM-024"
title = "Quota exhaustion recovers"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "the fake server answers `quota_exceeded` and later stops"
system = "installed client"
action = "keep the record pending with a quota error and no new identity, and upload it once quota is available"

[[requirements]]
id = "CLIENT-INTEGRATION-VM-025"
title = "Leases renew on boot with a stable machine identity"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "the VM boots, and boots again"
system = "installed client"
action = "create an owner-only `/var/lib/stockhouse/machine-id` once, renew slot 1 with the current system on each boot, and send the same machine identity after the reboot"

[[requirements]]
id = "CLIENT-INTEGRATION-VM-026"
title = "Leases renew after activation"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "the VM switches to another system generation"
system = "installed client"
action = "start `stockhouse-lease.service` through `stockhouse-lease-switch.timer` and renew slot 1 with the new system and slot 2 with the previous system"

[[requirements]]
id = "CLIENT-INTEGRATION-VM-027"
title = "Lease and upload outages block neither boot nor activation"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "the fake server is stopped while the VM switches configuration and reboots"
system = "installed client"
action = "complete the switch and the boot, run `stockhouse-lease.service` during the outage with `ExecMainStatus = 75` and `Result = success`, and keep pending records pending"

[[requirements]]
id = "CLIENT-INTEGRATION-VM-028"
title = "Uploads pending at reboot reach the server"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "a derivation is built while the uploader is stopped and the VM reboots with the server backend"
system = "installed client"
action = "upload it to the fake server after the reboot with the identity assigned before the reboot"

[[requirements]]
id = "CLIENT-INTEGRATION-VM-029"
title = "v1 servers are qualified through the auto fallback"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "the `upload`, `upload-recovery` and `lease` stories run against the fake server in `v1-only` mode with `uploader.protocol` left at `auto`"
system = "installed client"
action = "pass those stories with v1 requests only, after a protocol probe answered 404"

[[requirements]]
id = "CLIENT-INTEGRATION-VM-030"
title = "A closure uploads in a few batched requests"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "a closure of about twenty new paths, one of them already held by the fake server, is queued with protocol v2 available"
system = "installed client"
action = "upload it with one probe, one `v2/declare`, one `v2/nar` transfer per path not held, at most `maxInflightNars` concurrently, and one `v2/publish`, sending no v1 request and no NAR for the held path"

[[requirements]]
id = "CLIENT-INTEGRATION-VM-031"
title = "Leases renew in one batch with protocol v2"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "the lease service runs with protocol v2 available"
system = "installed client"
action = "renew slots 1 and 2 with one `v2/leases` request and exit 0"

[[requirements]]
id = "CLIENT-INTEGRATION-VM-032"
title = "A withdrawn v2 falls back to v1 at runtime"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "the fake server switches to `v1-only` while the uploader runs and a further derivation is built"
system = "installed client"
action = "upload it with v1 requests after a new protocol probe, with the record retried rather than failed"

[[requirements]]
id = "CLIENT-INTEGRATION-VM-033"
title = "A lost publish reply is reconciled without resending NARs"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "the fake server commits every publish batch and closes the connection without replying until `drop-publish` is removed"
system = "installed client"
action = "end the job uncertain after the bounded resends, and after the control is removed publish the closure through a later job that queries `v2/status`, with every NAR of the closure sent exactly once"

[[requirements]]
id = "CLIENT-INTEGRATION-VM-034"
title = "A restart during a v2 transfer keeps identities and asks first"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "the uploader is stopped while a v2 NAR transfer is stalled and then started again after the stall is released"
system = "installed client"
action = "query the stalled upload with `v2/status` before any NAR is resent and complete the closure with the identities assigned before the restart"

[[requirements]]
id = "CLIENT-INTEGRATION-VM-035"
title = "A busy server delays without consuming attempts"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "the fake server answers the next v2 batch request 429 with `Retry-After: 1`"
system = "installed client"
action = "resend the identical request after about one second and complete the upload with the record attempts unchanged"
