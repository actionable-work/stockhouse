group = "MODULE"

[[requirements]]
id = "CLIENT-INTEGRATION-MODULE-001"
title = "The flake exports the client module"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "the flake is evaluated"
system = "flake"
action = "export `nixosModules.default` and `nixosModules.client` as the same client module"

[[requirements]]
id = "CLIENT-INTEGRATION-MODULE-002"
title = "The proxy runs as a sandboxed dynamic-user service"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "`services.stockhouse.proxy.enable` is true and `services.stockhouse.auth.enable` is false"
system = "NixOS module"
action = "define `stockhouse-proxy.service` with `DynamicUser` and `Restart = on-failure`, running `stockhouse proxy --config` on the generated configuration"

[[requirements]]
id = "CLIENT-INTEGRATION-MODULE-003"
title = "Credential files load through systemd credentials"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "a proxy tier sets `credentialFile`"
system = "NixOS module"
action = "add `LoadCredential = <tier>:<path>` and generate `credential = { systemd = \"<tier>\" }` so the configuration contains the tier name but no credential value"

[[requirements]]
id = "CLIENT-INTEGRATION-MODULE-004"
title = "Store-path or relative credential files are rejected"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "a proxy tier sets `credentialFile` to a relative path or a path under `/nix/store`"
system = "NixOS module"
action = "fail evaluation with an assertion naming the tier"

[[requirements]]
id = "CLIENT-INTEGRATION-MODULE-005"
title = "Non-loopback proxy addresses are rejected"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "`services.stockhouse.proxy.address` is not a loopback address"
system = "NixOS module"
action = "fail evaluation with an assertion"

[[requirements]]
id = "CLIENT-INTEGRATION-MODULE-006"
title = "Nix uses the proxy as its only substituter"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "`proxy.configureNix` is true"
system = "NixOS module"
action = "force `nix.settings.substituters` to the proxy URL alone and add every tier's trusted keys to `nix.settings.trusted-public-keys`"

[[requirements]]
id = "CLIENT-INTEGRATION-MODULE-007"
title = "The uploader runs as its own user"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "`services.stockhouse.uploader.enable` is true"
system = "NixOS module"
action = "define `stockhouse-uploader.service` under the static `stockhouse` user with `StateDirectory = stockhouse` and `Restart = always`, running `stockhouse uploader --config` on the generated configuration"

[[requirements]]
id = "CLIENT-INTEGRATION-MODULE-008"
title = "The post-build hook is installed"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "`uploader.configureHook` is true"
system = "NixOS module"
action = "set `nix.settings.post-build-hook` to a store script that runs `stockhouse post-build-hook` with the configured queue directory and ignores its exit status"

[[requirements]]
id = "CLIENT-INTEGRATION-MODULE-009"
title = "The proxy unit is hardened"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "`services.stockhouse.proxy.enable` is true"
system = "NixOS module"
action = "set `ProtectSystem = strict`, `NoNewPrivileges`, `PrivateTmp` and `RestrictAddressFamilies = AF_INET AF_INET6 AF_UNIX` on `stockhouse-proxy.service`"

[[requirements]]
id = "CLIENT-INTEGRATION-MODULE-010"
title = "Sign-in configuration is generated without secrets"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "`services.stockhouse.auth.enable` is true"
system = "NixOS module"
action = "generate the sign-in configuration file with the server, endpoints, client ID, scopes, timeout, store settings and `private_tier` taken from `proxy.private.url`, expose it as `auth.configFile`, and give the proxy's private tier `credential = { server = \"<configFile>\" }`"

[[requirements]]
id = "CLIENT-INTEGRATION-MODULE-011"
title = "The proxy loads the sealing key as an encrypted systemd credential"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "`auth.store.mode` is `sealed`"
system = "NixOS module"
action = "add `LoadCredentialEncrypted = stockhouse-token-key:<keyCredentialFile>` to the proxy unit through `auth.unitCredential` and set `key_credential = \"stockhouse-token-key\"` in the generated configuration"

[[requirements]]
id = "CLIENT-INTEGRATION-MODULE-012"
title = "Plaintext token storage only when chosen"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "`auth.store.mode` is `file`"
system = "NixOS module"
action = "generate `mode = \"file\"` without a key credential, add no `LoadCredentialEncrypted` to `auth.unitCredential` and define no key oneshot"

[[requirements]]
id = "CLIENT-INTEGRATION-MODULE-013"
title = "Signed-in services share the stockhouse user"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "`services.stockhouse.auth.enable` and `proxy.enable` are true"
system = "NixOS module"
action = "run `stockhouse-proxy.service` without `DynamicUser` as the static `stockhouse` user and group, keeping the hardening of `CLIENT-INTEGRATION-MODULE-009`, setting `ProtectHome`, `RemoveIPC` and `RestrictSUIDSGID` explicitly, adding `UMask = 0077` and the `auth.unitCredential` service settings, and creating the store directory with a `tmpfiles` rule as `0700 stockhouse:stockhouse`"

[[requirements]]
id = "CLIENT-INTEGRATION-MODULE-014"
title = "Inconsistent sign-in settings are rejected"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "`auth.enable` is true and `proxy.private` is unset or has a `credentialFile`, a server, endpoint or private tier URL is neither `https://` nor `http://` to a loopback IP literal, or in sealed mode the key credential file or the store directory is relative or under `/nix/store`"
system = "NixOS module"
action = "fail evaluation with an assertion naming the option"

[[requirements]]
id = "CLIENT-INTEGRATION-MODULE-015"
title = "The stockhouse-auth wrapper runs sign-in as the service user"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "`services.stockhouse.auth.enable` is true"
system = "NixOS module"
action = "install a `stockhouse-auth` command that requires root, accepts only `login`, `login --device`, `logout`, `refresh` and `status`, and runs `stockhouse <command> --config <configFile>` through `systemd-run --wait --pipe` as the `stockhouse` user with the proxy's hardening and the `auth.unitCredential` service settings, without `PrivateNetwork` or `IPAddressDeny`"

[[requirements]]
id = "CLIENT-INTEGRATION-MODULE-016"
title = "The sealing key is created when absent"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "`auth.store.mode` is `sealed` and `auth.store.createKey` is true"
system = "NixOS module"
action = "define a root oneshot `stockhouse-token-key.service`, ordered before every unit that applies `auth.unitCredential`, that creates the key file with `systemd-creds encrypt --name=stockhouse-token-key` of 64 random hex characters only if it does not exist, failing on any failed step (`set -euo pipefail`), discarding a leftover temporary file and never replacing an existing key (`mv -n`)"

[[requirements]]
id = "CLIENT-INTEGRATION-MODULE-017"
title = "Units get the token through one shared value"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "`services.stockhouse.auth.enable` is true"
system = "NixOS module"
action = "expose `auth.unitCredential` with the credential spec `{ server = <configFile> }`, the `serviceConfig` (`ReadWritePaths` for the store directory and, in sealed mode, `LoadCredentialEncrypted`) and the key oneshot ordering, and apply it to the proxy unit"

[[requirements]]
id = "CLIENT-INTEGRATION-MODULE-018"
title = "The server backend uploads to the private tier"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "`uploader.backend` is `server`"
system = "NixOS module"
action = "generate a `server` backend whose `base_url` is `proxy.private.url` with the private credential: `auth.unitCredential`'s TOML and service settings when `auth.enable` is true, otherwise `credential = { systemd = \"private\" }` and `LoadCredential = private:<proxy.private.credentialFile>` on `stockhouse-uploader.service`"

[[requirements]]
id = "CLIENT-INTEGRATION-MODULE-019"
title = "The server backend needs a protected private tier"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "`uploader.backend` is `server` without a private tier, with neither `auth.enable` nor `proxy.private.credentialFile`, with a private URL not ending in `/`, or with an `http://` private URL whose host is not a loopback IP literal"
system = "NixOS module"
action = "fail evaluation with an assertion naming `services.stockhouse.uploader.backend`"

[[requirements]]
id = "CLIENT-INTEGRATION-MODULE-020"
title = "The lease service is a hardened, credentialed oneshot"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "`lease.enable` is true"
system = "NixOS module"
action = "define `stockhouse-lease.service` with `Type = oneshot`, the `stockhouse` user, the same private credential and hardening (`ProtectSystem = strict`, `ProtectHome`, `PrivateTmp`, `NoNewPrivileges`, `RestrictAddressFamilies = AF_INET AF_INET6 AF_UNIX`) as `stockhouse-uploader.service`, whose writable paths are only the queue directory, a `nix-copy` destination and sign-in paths, with `SuccessExitStatus = 75` and `ExecStart = stockhouse lease --config` on a configuration with the private tier URL and `/var/lib/stockhouse/machine-id`"

[[requirements]]
id = "CLIENT-INTEGRATION-MODULE-021"
title = "Leases renew on boot, hourly, daily and after activation"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "`lease.enable` is true"
system = "NixOS module"
action = "define a nonpersistent `stockhouse-lease.timer` with `OnBootSec = 1min` and `OnUnitActiveSec = 1h`, a separate `stockhouse-lease-daily.timer` with `OnCalendar = daily` and `Persistent = true`, both using `RandomizedDelaySec` from `lease.randomizedDelaySec` (default 600), and an activation snippet running `systemctl restart --no-block stockhouse-lease-switch.timer || true` whose timer has `OnActiveSec = 30s` and `AccuracySec = 1s`, all starting `stockhouse-lease.service`"

[[requirements]]
id = "CLIENT-INTEGRATION-MODULE-022"
title = "Lease renewal stays out of boot and activation"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "`lease.enable` is true"
system = "NixOS module"
action = "give `stockhouse-lease.service` and `stockhouse-lease-switch.timer` no `wantedBy`, `requiredBy` or `before` entries and install the boot/hourly and daily timers into `timers.target`"

[[requirements]]
id = "CLIENT-INTEGRATION-MODULE-023"
title = "Lease options are validated"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "`lease.enable` is true without the uploader enabled with the `server` backend, or `lease.extraSlots` has a slot outside 3–10, a repeated slot or a relative path"
system = "NixOS module"
action = "fail evaluation with an assertion naming the option"

[[requirements]]
id = "CLIENT-INTEGRATION-MODULE-024"
title = "Backoff options reach the uploader"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "`uploader.backoffBase` and `uploader.backoffMax` are set"
system = "NixOS module"
action = "write them as `backoff_base_secs` and `backoff_max_secs` and fail evaluation when `backoffBase` exceeds `backoffMax`"

[[requirements]]
id = "CLIENT-INTEGRATION-MODULE-025"
title = "Narinfo misses are cached briefly"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "`proxy.configureNix` is true"
system = "NixOS module"
action = "set `nix.settings.narinfo-cache-negative-ttl` to `proxy.narinfoCacheNegativeTtl` (default 60) at default priority, so a path published but not yet signed is retried within a minute and a configuration can still override it"

[[requirements]]
id = "CLIENT-INTEGRATION-MODULE-026"
title = "Substitution errors fall back to building"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "`proxy.configureNix` is true"
system = "NixOS module"
action = "set `nix.settings.fallback = true` at default priority, so a build whose substitution fails with a proxy 503 or 502 is built locally instead of failing"

[[requirements]]
id = "CLIENT-INTEGRATION-MODULE-027"
title = "The server protocol is shared by uploader and lease client"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "the uploader uses the `server` backend, with or without `uploader.protocol`"
system = "NixOS module"
action = "write `protocol` with the option value, default `auto`, into both the generated server backend and the lease configuration, and refuse values other than `auto`, `v1` and `v2`"

[[requirements]]
id = "CLIENT-INTEGRATION-MODULE-028"
title = "Concurrent NAR transfers are configurable within bounds"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "the uploader uses the `server` backend, with or without `uploader.maxInflightNars`"
system = "NixOS module"
action = "write `max_inflight_nars` with the option value, default 4, into the generated server backend and fail an assertion for a value outside 1 to 16"
