group = "CLI"

[[requirements]]
id = "CLIENT-INTEGRATION-CLI-001"
title = "Commands dispatch to their owners"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "`stockhouse_cli::main` receives `proxy`, `uploader`, `post-build-hook`, `status`, `login`, `logout`, `refresh` or `--version`"
system = "CLI entry point"
action = "run that command's owning library behavior and return its documented exit status"

[[requirements]]
id = "CLIENT-INTEGRATION-CLI-002"
title = "Usage errors exit 2"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "`stockhouse_cli::main` receives no command, an unknown command, an unknown flag or a flag without its value"
system = "CLI entry point"
action = "print usage to stderr and return exit status 2"

[[requirements]]
id = "CLIENT-INTEGRATION-CLI-003"
title = "No argument accepts a credential"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "a credential-like flag such as `--token` is passed"
system = "CLI entry point"
action = "reject it as an unknown flag with exit status 2"

[[requirements]]
id = "CLIENT-INTEGRATION-CLI-005"
title = "Status prints one JSON object"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "`status --queue <dir>` is run on an initialized queue"
system = "CLI entry point"
action = "print the queue status as one JSON object and return exit status 0"

[[requirements]]
id = "CLIENT-INTEGRATION-CLI-006"
title = "Configuration errors exit 2"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "`proxy` or `uploader` is run with a configuration that fails to load"
system = "CLI entry point"
action = "print the configuration error to stderr and return exit status 2"

[[requirements]]
id = "CLIENT-INTEGRATION-CLI-007"
title = "Login signs in through the chosen flow"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "`login --config <auth.toml>` or `login --config <auth.toml> --device` is run"
system = "CLI entry point"
action = "run the loopback or device sign-in flow, print its prompts to stdout and return 0 once the token set is stored, 1 when the flow fails and 2 when the configuration fails to load"

[[requirements]]
id = "CLIENT-INTEGRATION-CLI-008"
title = "Logout reports a failed revocation"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "`logout --config <auth.toml>` is run"
system = "CLI entry point"
action = "return 0 when the tokens were revoked and deleted or none were stored, and 1 with a message that the client is signed out locally when revocation failed"

[[requirements]]
id = "CLIENT-INTEGRATION-CLI-009"
title = "Refresh reports the outcome"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "`refresh --config <auth.toml>` is run"
system = "CLI entry point"
action = "return 0 after a refresh, and 1 with a message to sign in again when the client is signed out or the refresh failed"

[[requirements]]
id = "CLIENT-INTEGRATION-CLI-010"
title = "Session status prints one JSON object"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "`status --config <auth.toml>` is run"
system = "CLI entry point"
action = "print the session status as one JSON object without any token and return 0 when signed in and 1 otherwise"

[[requirements]]
id = "CLIENT-INTEGRATION-CLI-011"
title = "Status needs exactly one target"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "`status` is run with both `--queue` and `--config` or with neither"
system = "CLI entry point"
action = "print usage to stderr and return exit status 2"

[[requirements]]
id = "CLIENT-INTEGRATION-CLI-012"
title = "Sign-in output never contains secrets"
manual = false
design = "design/integration.md"
[requirements.ears]
type = "event"
trigger = "`login`, `logout`, `refresh` or `status` runs against a fake server, succeeding or failing"
system = "CLI entry point"
action = "write stdout and stderr that contain no access token, refresh token, authorization code, PKCE verifier or device code, and contain `state` and `code_challenge` only inside the printed authorization URL"
